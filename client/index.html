<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="common-header">
    </header>
    <div class="container">
      <div class="page login-page active">
        <div class="form">
          <div class="form-container">
            <div class="heading">Task Tracker</div>
            <div class="login-heading">Login</div>
            <form id="loginForm">
              <div class="entryarea">
                <input type="text" id="loginUsername" name="loginUsername" value="ConorKelly" required />
                <label for="loginUsername" class="labelline">Username or email</label>
                
              </div>
              <p id="loginNameError"></p>
              <div class="entryarea">
                <input
                  type="password"
                  id="loginPassword"
                  name="loginPassword"
                  placeholder=" "
                  value="SecurePassword123@"
                  required
                />
                <label for="loginPassword" class="labelline">Password</label>
                
              </div>
              <p id="loginPasswordError"></p>
              <p id="loginAttempts"></p>
              <input type="submit" value="Login" id="btn1" />
              <div class="switch">
                <span>Don't have an account?</span>
                <label for="check" class="switch-label" 
                data-target="register-page">
                Register Now</label>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="page register-page">
        <div class="form">
          <div class="form-container">
            <div class="heading">Register</div>
            <form id="registerForm">
              <div class="entryarea">
                <input type="text" id="registerName" name="registerName" placeholder=" " required />
                <label for="registerName" class="labelline">Name</label>
               
              </div>
              <p id="nameError"></p>
              <div class="entryarea">
                <input type="text" id="registerUsername" name="registerUsername" placeholder=" " required />
                <label for="registerUsername" class="labelline">Username</label>
                
              </div>
              <p id="usernameError"></p>
              <div class="entryarea">
                <input type="email" id="registerEmail" name="registerEmail" placeholder=" " required />
                <label for="registerEmail" class="labelline">Email</label>
                
              </div>
              <p id="emailError"></p>
              <div class="entryarea">
                <input
                  type="password"
                  id="registerPassword"
                  name="registerPassword"
                  placeholder=" "
                  required
                />
                <label for="registerPassword" class="labelline">Password</label>
                
              </div>
              <p id="passwordError"></p>
              <div class="entryarea">
                <input
                  type="password"
                  id="registerConfirmPassword"
                  name="registerConfirmPassword"
                  placeholder=" "
                  required
                />
                <label for="registerConfirmPassword" class="labelline"
                  >Confirm Password</label
                >
                
              </div>
              <p id="confirmPasswordError"></p>
              <input type="submit" value="Register" id="btn2" />
              <p id="registrationSuccessMessage"></p>
              <div class="switch">
                <span>Already have an account?</span>
                <label for="check" class="switch-label" 
                data-target="login-page">
                Login Now</label>
              </div>
            </form>
          </div>
        </div>
      </div>
      <input type="checkbox" id="check" />
    </div>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/register.js"></script>
    <script type="module" src="js/utils.js"></script>
  </body>
</html>
