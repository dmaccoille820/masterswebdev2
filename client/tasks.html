<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="common-header">
        
    
    <div class="container">
        <div class="page active" id="tasksPage">
            <div class="header-container">
                <div class="heading">
                  <nav>
                    <a href="" ><label for="toggleCreateTask" >New Task</a></label>
                      <a href="/dashboard">Dashboard</a>
                      <a id="logoutBtn" href="/logout">Logout</a>
                  </nav>
                </span><br>Tasks for<span id="usernameTasks"></span></div>
                <div class="checkbox-container">
                  <input type="checkbox" id="toggleCreateTask">
              </div>
                
            </div>
          </header>

            <div class="new-task-container" id="newTaskContainer">
                <div class="heading">Create New Task</div>
                <form id="newTaskForm">
                  <div class="entryarea">
                    <input type="text" id="taskName" name="taskName" required/>
                    <label for="taskName" class="labelline">Task Name</label>
                  </div>
                  <div class="entryarea">
                    <input type="text" id="taskDescription" name="taskDescription" required/>
                    <label for="taskDescription" class="labelline">Task Description</label>
                  </div>
                  <div class="entryarea">
                    <input type="date" id="taskDueDate" name="taskDueDate" required/>
                    <label for="taskDueDate" class="labelline">Due Date</label>
                  </div>
                  <div class="entryarea">
                    <label for="taskPriority" class="labelline">Priority</label>
                    <select id="taskPriority" name="taskPriority" required>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                  </div>
                  <div class="entryarea">
                    <label for="taskStatus" class="labelline">Status</label>
                    <select id="taskStatus" name="taskStatus" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                  </div>
                  <button type="submit" id="submitNewTask">Create Task</button>
              </form>
            </div>
            <div class="table-container" id="tasksTableContainer">
              <table id="tasksTable" class="table">
                  <thead>
                      <tr>
                          <th>Task Name</th>
                          <th>Description</th>
                          <th>Due Date</th>
                          <th>Priority</th>
                          <th>Status</th>
                      </tr>
                  </thead>
                  <tbody id="tasksTableBody">
                      <!-- Tasks will be loaded here -->
                  </tbody>
              </table>
          </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
